<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Đặt lịch khám Online</title>
    
    <script type="text/javascript">
        // 1. DÁN LINK WEB RENDER THẬT CỦA BẠN VÀO GIỮA HAI DẤU NHÁY ĐƠN DƯỚI ĐÂY:
        const targetUrl = "https://dat-lich-kham-online-hree.onrender.com"; // THAY THẾ BẰNG LINK WEB RENDER THẬT CỦA BẠN 

        // Tự động cập nhật link cho thẻ meta refresh và lệnh chuyển hướng
        document.write(`<meta http-equiv="refresh" content="0; url=${targetUrl}">`);
        window.location.href = targetUrl;
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 100px; font-family: Arial, sans-serif;">
        <h2>Đang kết nối tới Hệ thống Đặt lịch khám Online...</h2>
        <p>Vui lòng đợi trong giây lát. Nếu trang web không tự chuyển hướng, 
           <a id="redirect-link" href="#">hãy bấm vào đây</a>.
        </p>
    </div>

    <script type="text/javascript">
        // Cập nhật link dự phòng ở thẻ <a> nếu người dùng phải bấm thủ công
        document.getElementById('redirect-link').href = targetUrl;
    </script>
</body>
</html>
